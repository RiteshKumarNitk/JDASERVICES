<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2318324A%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-family=%27Arial%27 font-size=%2711%27 font-weight=%27700%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EJDA%3C/text%3E%3C/svg%3E" />
  <title>Pending Summary — JDA Admin Panel</title>
  <link rel="stylesheet" href="../css/admin-layout.css" />
  <link rel="stylesheet" href="../css/admin-components.css" />
  <link rel="stylesheet" href="../css/admin-pages.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<!--
  PENDING SUMMARY — counts of every pending category + service-wise pending.
  Every count links to the filtered application list.
-->
<body class="admin-body" data-admin-page="pending-summary">

  <main class="admin-main" id="adminMain">
    <div class="admin-page-header">
      <div>
        <ol class="admin-breadcrumb" aria-label="Breadcrumb">
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><span aria-current="page">Pending Summary</span></li>
        </ol>
        <h1 class="admin-page-title">Pending Summary</h1>
        <p class="admin-page-subtitle">Pending files of your charge by category and by service. Click any count to open the list.</p>
      </div>
    </div>

    <div class="admin-summary-grid">
      <section class="admin-card" aria-labelledby="catTitle">
        <div class="admin-card-head"><h2 class="admin-section-title" id="catTitle">By Category</h2></div>
        <div class="admin-table-wrap">
          <table class="admin-table admin-table--compact">
            <thead><tr><th scope="col">Category</th><th scope="col" class="admin-col-amount">Files</th><th scope="col" class="admin-col-actions">Action</th></tr></thead>
            <tbody id="categoryBody"></tbody>
          </table>
        </div>
      </section>

      <section class="admin-card" aria-labelledby="svcTitle">
        <div class="admin-card-head"><h2 class="admin-section-title" id="svcTitle">By Service</h2></div>
        <div class="admin-table-wrap">
          <table class="admin-table admin-table--compact">
            <thead>
              <tr>
                <th scope="col">Service Name</th>
                <th scope="col" class="admin-col-amount">Received</th>
                <th scope="col" class="admin-col-amount">My Pending</th>
                <th scope="col" class="admin-col-amount">On Hold</th>
                <th scope="col" class="admin-col-amount">Due Expired</th>
              </tr>
            </thead>
            <tbody id="serviceBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="../js/admin-data.js"></script>
  <script src="../js/admin-common.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script src="../js/admin-dashboard.js"></script>
</body>
</html>
