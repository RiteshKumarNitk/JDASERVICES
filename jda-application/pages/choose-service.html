    <!-- Progress: is-done = finished step, is-current = this page -->
    <nav class="stepper-card" aria-label="Application progress">
      <ol class="stepper">
        <li class="step is-current"><span class="step-badge">SS</span><span class="step-txt"><b>Select</b><span>Service</span></span></li>

        <li class="step"><span class="step-badge">AP</span><span class="step-txt"><b>Applicant</b><span>Profile</span></span></li>

          <div class="field" id="fld-service">
            <div class="field-head">
              <span class="step-no">1</span>
              <label class="f-label" for="serviceSelect">Select Service <i>*</i></label>
            </div>
            <select class="ss-native" id="serviceSelect" data-placeholder="Select Service" hidden required></select>
          </div>

          <div class="field" id="fld-subservice">
            <div class="field-head">
              <span class="step-no">2</span>
              <label class="f-label" for="subServiceSelect">Developer Type <i>*</i></label>
            </div>
            <select class="ss-native" id="subServiceSelect" data-placeholder="Select Developer Type" hidden required></select>
          </div>

          <div class="field" id="fld-basedon">

              <span class="step-no">3</span>

            <select class="ss-native" id="basedOnSelect" data-placeholder="Select Applicable Provision" hidden required></select>
          </div>
