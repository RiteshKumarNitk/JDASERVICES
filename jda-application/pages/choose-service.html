  <div class="page">
    <nav class="stepper-card" aria-label="Application progress">
      <ol class="stepper" id="stepper"></ol>

    <main>
      <div class="form-card">
        <header class="card-head">
          <span class="head-icon"><svg class="ic"><use href="#i-list"/></svg></span>
          <div class="head-txt">
            <h1>Choose Service</h1>
            <p>Select the main service and related options to continue with your application.</p>
          </div>
        </header>

        <div class="card-body" id="chooseFields">

          <div class="field" id="fld-service">
            <div class="field-head">
              <span class="step-no">1</span>
              <label class="f-label" for="serviceSelect">Select Service <i>*</i></label>
            </div>
            <select class="ss-native" id="serviceSelect" data-placeholder="Select Service" hidden required></select>
          </div>

          <div class="field" id="fld-subservice">
            <div class="field-head">
              <span class="step-no">2</span>
              <label class="f-label" for="subServiceSelect">Select Sub Service <i>*</i></label>
            </div>
            <select class="ss-native" id="subServiceSelect" data-placeholder="Select Sub Service" hidden required></select>
          </div>

          <div class="field" id="fld-basedon">
            <div class="field-head">
              <span class="step-no">3</span>
              <label class="f-label" for="basedOnSelect">Based On <i>*</i></label>
            </div>
            <select class="ss-native" id="basedOnSelect" data-placeholder="Select Based On" hidden required></select>
          </div>
