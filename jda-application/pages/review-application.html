<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review Application — JDA Property Services</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <script src="../js/navigation.js" defer></script>
  <script src="../js/main.js" defer></script>
</head>
<body data-page="review" data-step="5">

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><line x1="10" y1="11" x2="14" y2="11"/><line x1="10" y1="15" x2="14" y2="15"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-arrR" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="13 5 20 12 13 19"/></symbol>
    <symbol id="i-arrL" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="12" x2="4" y2="12"/><polyline points="11 5 4 12 11 19"/></symbol>
  </svg>

  <div class="page">
    <nav class="stepper-card" aria-label="Application progress">
      <ol class="stepper" id="stepper"></ol>
    </nav>

    <main>
      <div class="form-card">
        <div class="page-hero">
          <span class="hero-badge">RA</span>
          <div>
            <h1>Review Application</h1>
            <p>Review the details provided across each step before final submission</p>
          </div>
        </div>

        <div class="card-body">

          <div id="reviewSummary"></div>

          <label class="check-row boxed" for="reviewConfirm">
            <input type="checkbox" id="reviewConfirm" name="reviewConfirm" value="accepted" />
            <span class="cb"><svg class="ic"><use href="#i-check"/></svg></span>
            <span class="cb-label">Confirm the details above are correct before proceeding.</span>
          </label>

        </div>

        <div class="card-foot">
          <a class="btn btn-outline" href="document-section.html"><svg class="ic"><use href="#i-arrL"/></svg> Back</a>
          <div class="foot-actions">
            <button class="btn btn-outline" type="button" id="printReview">Print</button>
            <a class="btn btn-primary" href="final-submission.html">Proceed to Final Submission <svg class="ic"><use href="#i-arrR"/></svg></a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
