<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Witness Profile — JDA Property Services</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/forms.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <script src="../js/navigation.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/applicant.js" defer></script>
</head>
<body data-page="witness-details" data-step="2">

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-arrR" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="13 5 20 12 13 19"/></symbol>
    <symbol id="i-arrL" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="12" x2="4" y2="12"/><polyline points="11 5 4 12 11 19"/></symbol>
  </svg>

  <div class="page">
    <nav class="stepper-card" aria-label="Application progress">
      <ol class="stepper" id="stepper"></ol>
    </nav>

    <main>
      <div id="witnessRoot">
        <section class="form-card section" id="witnessForm">
          <div class="page-hero">
            <span class="hero-badge">WT</span>
            <div>
              <h1>Witness Profile</h1>
              <p>Fill in the details of the witness to the Power of Attorney deed.</p>
            </div>
          </div>

          <!-- Saved witness (read-only) — shown when witness data already exists -->
          <div id="witnessSummary" hidden></div>

          <div class="card-body" id="witnessFormBody">
            <div class="seg-tabs">
              <label class="seg-tab">
                <input type="radio" name="aadhaar-witness" value="with" checked />
                <span>With Aadhaar</span>
              </label>
              <label class="seg-tab">
                <input type="radio" name="aadhaar-witness" value="without" />
                <span>Without Aadhaar</span>
              </label>
            </div>

            <div class="fetch-block" data-block="witness">
              <div class="field">
                <div class="field-head"><label class="f-label" for="witnessAadhaar">Aadhaar No</label></div>
                <div class="fetch-row">
                  <input class="input" type="text" id="witnessAadhaar" data-aadhaar value="6789 0123 4567" placeholder="Enter Aadhaar No" inputmode="numeric" maxlength="14" autocomplete="off" data-vtype="aadhaar" />
                  <button class="btn btn-primary fetch-btn" type="button" data-fetch>
                    <svg class="ic"><use href="#i-search"/></svg> Fetch Detail
                  </button>
                </div>
              </div>
            </div>

            <div class="form-grid">
              <div class="field">
                <div class="field-head">
                  <label class="f-label" for="witnessName">Name of Witness</label>                </div>
                <div class="input-group">
                  <span class="ig-icon"><svg class="ic"><use href="#i-user"/></svg></span>
                  <input class="input-plain is-locked" type="text" id="witnessName" data-auto="name" data-aadhaar-lock value="DEEPAK VERMA" placeholder="Enter name of witness" readonly />
                </div>
              </div>
              <div class="field">
                <div class="field-head"><label class="f-label" for="witnessFather">Father / Husband Name</label></div>
                <div class="input-group">
                  <span class="ig-icon"><svg class="ic"><use href="#i-user"/></svg></span>
                  <input class="input-plain" type="text" id="witnessFather" data-auto="father" value="RAMESH VERMA" placeholder="Enter father / husband name" />
                </div>
              </div>
              <div class="field">
                <div class="field-head"><label class="f-label" for="relWitness">Relation</label></div>
                <select class="ss-native" id="relWitness" data-placeholder="Select relation" data-auto="relation" hidden>
                  <option value="Father">Father</option>
                  <option value="Husband">Husband</option>
                  <option value="Mother">Mother</option>
                  <option value="Guardian">Guardian</option>
                  <option value="Other" selected>Other</option>
                </select>
              </div>
              <div class="field span-2">
                <div class="field-head">
                  <label class="f-label" for="witnessAddress">Address</label>                </div>
                <div class="ta-wrap has-icon">
                  <span class="ta-icon"><svg class="ic"><use href="#i-pin"/></svg></span>
                  <textarea class="textarea is-locked" id="witnessAddress" data-count data-auto="address" data-aadhaar-lock placeholder="Enter address" maxlength="500" readonly>7, Bani Park, Jaipur, Rajasthan 302016</textarea>
                  <span class="char-count">0/500</span>
                </div>
              </div>
            </div>
          </div>

          <div class="card-foot">
            <a class="btn btn-outline" href="applicant-profile.html"><svg class="ic"><use href="#i-arrL"/></svg> Back</a>
            <button class="btn btn-outline" type="button" id="saveWitnessEdit" hidden><svg class="ic"><use href="#i-check"/></svg> Save</button>
            <button class="btn btn-primary" type="button" id="continueWitness">Proceed <svg class="ic"><use href="#i-arrR"/></svg></button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
