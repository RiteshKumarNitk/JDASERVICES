<!-- Applicant Details — Individual / Joint (reusable form fragment)
     Loaded by pages/applicant-profile.html for Self and POA flows. -->
<section class="form-card section">
  <header class="card-head">
    <span class="head-icon"><svg class="ic"><use href="#i-user"/></svg></span>
    <div class="head-txt">
      <h2>Applicant Details</h2>
      <p>Fill in the required details to fetch your application information.</p>
    </div>
  </header>

  <div class="card-body">

    <!-- With / Without Aadhaar -->
    <div class="seg-tabs">
      <label class="seg-tab">
        <input type="radio" name="aadhaar-applicant" value="with" checked />
        <span>With Aadhaar</span>
      </label>
      <label class="seg-tab">
        <input type="radio" name="aadhaar-applicant" value="without" />
        <span>Without Aadhaar</span>
      </label>
    </div>

    <!-- Aadhaar fetch row -->
    <div class="fetch-block" data-block="applicant">
      <div class="field">
        <div class="field-head">
          <label class="f-label" for="applicantAadhaar">Aadhaar Number <i>*</i></label>
        </div>
        <div class="fetch-row">
          <input class="input" type="text" id="applicantAadhaar" data-aadhaar placeholder="Enter 12 digit Aadhaar number" inputmode="numeric" maxlength="14" autocomplete="off" required data-vtype="aadhaar" />
          <button class="btn btn-primary fetch-btn" type="button" data-fetch>
            <svg class="ic"><use href="#i-search"/></svg> Fetch Detail
          </button>
        </div>
      </div>
    </div>

    <div class="form-grid">
      <div class="field">
        <div class="field-head">
          <label class="f-label" for="apName">Name of Applicant <i>*</i></label>        </div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-user"/></svg></span>
          <input class="input-plain is-locked" type="text" id="apName" data-auto="name" data-aadhaar-lock value="ARUN KUMAR SHARMA" placeholder="Enter applicant name" required readonly />
        </div>
      </div>
      <div class="field">
        <div class="field-head">
          <label class="f-label" for="apMobile">Mobile Number <i>*</i></label>        </div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-phone"/></svg></span>
          <span class="ig-prefix">+91</span>
          <input class="input-plain is-locked" type="text" id="apMobile" data-auto="mobile" data-aadhaar-lock value="9829012345" placeholder="Enter mobile number" inputmode="numeric" maxlength="10" required data-vtype="mobile" readonly />
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="apFather">Father / Husband Name <i>*</i></label></div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-user"/></svg></span>
          <input class="input-plain" type="text" id="apFather" data-auto="father" placeholder="Enter father / husband name" required />
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="relApplicant">Relation <i>*</i></label></div>
        <select class="ss-native" id="relApplicant" data-placeholder="Select relation" hidden required>
          <option value="Father">Father</option>
          <option value="Husband">Husband</option>
          <option value="Mother">Mother</option>
          <option value="Guardian">Guardian</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field span-2">
        <div class="field-head">
          <label class="f-label" for="apAddress">Applicant Address <i>*</i></label>        </div>
        <div class="ta-wrap has-icon">
          <span class="ta-icon"><svg class="ic"><use href="#i-pin"/></svg></span>
          <textarea class="textarea is-locked" id="apAddress" data-count data-auto="address" data-aadhaar-lock placeholder="Enter complete address" maxlength="500" required readonly>12, Vidhyadhar Nagar, Sector 4, Jaipur, Rajasthan 302039</textarea>
          <span class="char-count">0/500</span>
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="apEmail">Email Id</label></div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-mail"/></svg></span>
          <input class="input-plain" type="text" id="apEmail" placeholder="Enter email address" data-vtype="email" />
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="apWhatsapp">WhatsApp Number</label></div>
        <div class="input-group">
          <span class="ig-icon wa-ic"><svg class="ic"><use href="#i-wa"/></svg></span>
          <span class="ig-prefix">+91</span>
          <input class="input-plain" type="text" id="apWhatsapp" data-auto="whatsapp" value="9829012345" placeholder="Enter WhatsApp number" inputmode="numeric" maxlength="10" data-vtype="mobile" />
        </div>
      </div>
    </div>

    <!-- Joint (co-applicant) panel -->
    <div class="joint-panel" data-joint-panel hidden>
      <h3 class="panel-title">Co-Applicant (Joint) Details</h3>
      <div class="form-grid">
        <div class="field">
          <div class="field-head"><label class="f-label" for="jaName">Name of Co-Applicant <i>*</i></label></div>
          <div class="input-group">
            <span class="ig-icon"><svg class="ic"><use href="#i-user"/></svg></span>
            <input class="input-plain" type="text" id="jaName" placeholder="Enter co-applicant name" required />
          </div>
        </div>
        <div class="field">
          <div class="field-head"><label class="f-label" for="jaFather">Father / Husband Name <i>*</i></label></div>
          <div class="input-group">
            <span class="ig-icon"><svg class="ic"><use href="#i-user"/></svg></span>
            <input class="input-plain" type="text" id="jaFather" placeholder="Enter father / husband name" required />
          </div>
        </div>
        <div class="field">
          <div class="field-head"><label class="f-label" for="jaMobile">Mobile Number <i>*</i></label></div>
          <div class="input-group">
            <span class="ig-prefix">+91</span>
            <input class="input-plain" type="text" id="jaMobile" placeholder="Enter mobile number" inputmode="numeric" maxlength="10" required data-vtype="mobile" />
          </div>
        </div>
        <div class="field">
          <div class="field-head"><label class="f-label" for="jaEmail">Email Id</label></div>
          <div class="input-group">
            <span class="ig-icon"><svg class="ic"><use href="#i-mail"/></svg></span>
            <input class="input-plain" type="text" id="jaEmail" placeholder="Enter email address" data-vtype="email" />
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
