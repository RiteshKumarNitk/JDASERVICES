<!-- Company Details — reusable form fragment
     Fields are pre-filled with sample data for demonstration. -->
<section class="form-card section">
  <div class="block-bar" style="cursor:default">
    <span class="block-title">Company Details</span>
  </div>

  <div class="card-body">
    <div class="seg-tabs">
      <label class="seg-tab">
        <input type="radio" name="aadhaar-company" value="with" checked />
        <span>With Aadhaar</span>
      </label>
      <label class="seg-tab">
        <input type="radio" name="aadhaar-company" value="without" />
        <span>Without Aadhaar</span>
      </label>
    </div>

    <p class="sec-sub" data-aadhaar-msg
       data-with-msg="Fill in the authorised person's Aadhaar number to fetch their details."
       data-without-msg="Enter the authorised person's details manually to continue.">Fill in the authorised person's Aadhaar number to fetch their details.</p>

    <div class="fetch-block" data-block="company">
      <div class="field">
        <div class="field-head"><label class="f-label" for="coAadhaar">Aadhaar Number <i>*</i></label></div>
        <div class="fetch-row">
          <input class="input" type="text" id="coAadhaar" data-aadhaar value="9012 3456 7890" placeholder="Enter 12 digit Aadhaar number" inputmode="numeric" maxlength="14" autocomplete="off" required data-vtype="aadhaar" />
          <button class="btn btn-primary fetch-btn" type="button" data-fetch>
            <svg class="ic"><use href="#i-search"/></svg> Fetch Detail
          </button>
        </div>
      </div>
    </div>

    <div class="form-grid">
      <div class="field span-2">
        <div class="field-head"><label class="f-label" for="coName">Name of Company <i>*</i></label></div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-building"/></svg></span>
          <input class="input-plain" type="text" id="coName" value="" placeholder="i.e. Company Name Jariye" required />
        </div>
      </div>
      <div class="field span-2">
        <div class="field-head"><label class="f-label" for="coAddress">Current Address <i>*</i></label></div>
        <div class="ta-wrap has-icon">
          <span class="ta-icon"><svg class="ic"><use href="#i-pin"/></svg></span>
          <textarea class="textarea" id="coAddress" data-auto="address" placeholder="Enter complete address of company" maxlength="500" required data-count>Plot 21, Sitapura Industrial Area, Tonk Road, Jaipur, Rajasthan 302022</textarea>
          <span class="char-count">0/500</span>
        </div>
      </div>
      <div class="field span-2">
        <div class="field-head">
          <label class="f-label" for="coPermAddress">Permanent Address <i>*</i></label>
          <label class="check-row same-addr-check" for="coSameAddress">
            <input type="checkbox" id="coSameAddress" data-same-address data-source="coAddress" data-target="coPermAddress" checked />
            <span class="cb"><svg class="ic"><use href="#i-check"/></svg></span>
            <span class="cb-label">Same as Current Address</span>
          </label>
        </div>
        <div class="ta-wrap has-icon">
          <span class="ta-icon"><svg class="ic"><use href="#i-pin"/></svg></span>
          <textarea class="textarea is-locked" id="coPermAddress" data-count placeholder="Enter permanent address" maxlength="500" required readonly></textarea>
          <span class="char-count">0/500</span>
        </div>
      </div>
      
      <div class="field">
        <div class="field-head"><label class="f-label" for="coOwner">Owner / Director / Representative Name <i>*</i></label></div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-user"/></svg></span>
          <input class="input-plain" type="text" id="coOwner" data-auto="name" value="" placeholder="Enter owner / director / representative name" required />
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="coMobile">Mobile No <i>*</i></label></div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-phone"/></svg></span>
          <span class="ig-prefix">+91</span>
          <input class="input-plain" type="text" id="coMobile" data-auto="mobile" value="9887766554" placeholder="Enter mobile number" inputmode="numeric" maxlength="10" required data-vtype="mobile" />
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="coFather">Father / Husband Name</label></div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-user"/></svg></span>
          <input class="input-plain" type="text" id="coFather" data-auto="father" value="MOHAN LAL MEENA" placeholder="Enter father / husband name" />
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="relCompany">Relation</label></div>
        <select class="ss-native" id="relCompany" data-placeholder="Select relation" hidden>
          <option value="Father" selected>Father</option>
          <option value="Husband">Husband</option>
          <option value="Mother">Mother</option>
          <option value="Guardian">Guardian</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="coEmail">Email Id</label></div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-mail"/></svg></span>
          <input class="input-plain" type="text" id="coEmail" value="contact@sandveek.example.com" placeholder="Enter email id" data-vtype="email" />
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="coWhatsapp">WhatsApp No.</label></div>
        <div class="input-group">
          <span class="ig-icon wa-ic"><svg class="ic"><use href="#i-wa"/></svg></span>
          <span class="ig-prefix">+91</span>
          <input class="input-plain" type="text" id="coWhatsapp" value="9887766554" placeholder="Enter WhatsApp number" inputmode="numeric" maxlength="10" data-vtype="mobile" />
        </div>
      </div>
    </div>
  </div>
</section>
