<!-- Company POA Details — reusable form fragment (follows Company Details)
     Fields are pre-filled with sample data for demonstration. -->
<section class="form-card section">
  <header class="card-head">
    <span class="head-icon"><svg class="ic"><use href="#i-doc"/></svg></span>
    <div class="head-txt">
      <h2>Company POA Details</h2>
      <p>Fill in the details of the Power of Attorney holder authorised by the company.</p>
    </div>
  </header>

  <div class="card-body">
    <div class="seg-tabs">
      <label class="seg-tab">
        <input type="radio" name="aadhaar-companyPoa" value="with" checked />
        <span>With Aadhaar</span>
      </label>
      <label class="seg-tab">
        <input type="radio" name="aadhaar-companyPoa" value="without" />
        <span>Without Aadhaar</span>
      </label>
    </div>

    <div class="fetch-block" data-block="companyPoa">
      <div class="field">
        <div class="field-head"><label class="f-label" for="cpoaAadhaar">Aadhaar Number <i>*</i></label></div>
        <div class="fetch-row">
          <input class="input" type="text" id="cpoaAadhaar" data-aadhaar value="5678 9012 3456" placeholder="Enter 12 digit Aadhaar number" inputmode="numeric" maxlength="14" autocomplete="off" required data-vtype="aadhaar" />
          <button class="btn btn-primary fetch-btn" type="button" data-fetch>
            <svg class="ic"><use href="#i-search"/></svg> Fetch Detail
          </button>
        </div>
      </div>
    </div>

    <div class="form-grid">
      <div class="field">
        <div class="field-head">
          <label class="f-label" for="cpoaName">Name of POA Holder <i>*</i></label>        </div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-user"/></svg></span>
          <input class="input-plain is-locked" type="text" id="cpoaName" data-auto="name" data-aadhaar-lock value="NEERAJ MEENA" placeholder="Enter name of POA holder" required readonly />
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="cpoaDesig">Designation in Company <i>*</i></label></div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-building"/></svg></span>
          <input class="input-plain" type="text" id="cpoaDesig" value="Authorised Signatory" placeholder="Enter designation (e.g. Director, Authorised Signatory)" required />
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="cpoaFather">Father / Husband Name</label></div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-user"/></svg></span>
          <input class="input-plain" type="text" id="cpoaFather" data-auto="father" value="MOHAN LAL MEENA" placeholder="Enter father / husband name" />
        </div>
      </div>
      <div class="field">
        <div class="field-head">
          <label class="f-label" for="cpoaMobile">Mobile No <i>*</i></label>        </div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-phone"/></svg></span>
          <span class="ig-prefix">+91</span>
          <input class="input-plain is-locked" type="text" id="cpoaMobile" data-auto="mobile" data-aadhaar-lock value="9887766554" placeholder="Enter mobile number" inputmode="numeric" maxlength="10" required data-vtype="mobile" readonly />
        </div>
      </div>
      <div class="field span-2">
        <div class="field-head">
          <label class="f-label" for="cpoaAddress">POA Address</label>        </div>
        <div class="ta-wrap has-icon">
          <span class="ta-icon"><svg class="ic"><use href="#i-pin"/></svg></span>
          <textarea class="textarea is-locked" id="cpoaAddress" data-count data-auto="address" data-aadhaar-lock placeholder="Enter address" maxlength="500" readonly>Plot 21, Sitapura Industrial Area, Tonk Road, Jaipur, Rajasthan 302022</textarea>
          <span class="char-count">0/500</span>
        </div>
      </div>
    </div>
  </div>
</section>
