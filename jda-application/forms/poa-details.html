<!-- POA Details — reusable form fragment (loaded after Applicant Details)
     Fields are pre-filled with sample data for demonstration. -->
<section class="form-card section">
  <header class="card-head">
    <span class="head-icon"><svg class="ic"><use href="#i-doc"/></svg></span>
    <div class="head-txt">
      <h2>POA Details</h2>
      <p>Fill in the Power of Attorney (POA) holder details as per the registered deed.</p>
    </div>
  </header>

  <div class="card-body">
    <div class="seg-tabs">
      <label class="seg-tab">
        <input type="radio" name="aadhaar-poa" value="with" checked />
        <span>With Aadhaar</span>
      </label>
      <label class="seg-tab">
        <input type="radio" name="aadhaar-poa" value="without" />
        <span>Without Aadhaar</span>
      </label>
    </div>

    <div class="fetch-block" data-block="poa">
      <div class="field">
        <div class="field-head"><label class="f-label" for="poaAadhaar">Aadhaar No</label></div>
        <div class="fetch-row">
          <input class="input" type="text" id="poaAadhaar" data-aadhaar value="2345 6789 0123" placeholder="Enter Aadhaar No" inputmode="numeric" maxlength="14" autocomplete="off" data-vtype="aadhaar" />
          <button class="btn btn-primary fetch-btn" type="button" data-fetch>
            <svg class="ic"><use href="#i-search"/></svg> Fetch Detail
          </button>
        </div>
      </div>
    </div>

    <div class="form-grid">
      <div class="field">
        <div class="field-head">
          <label class="f-label" for="poaName">Name of POA</label>        </div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-user"/></svg></span>
          <input class="input-plain is-locked" type="text" id="poaName" data-auto="name" data-aadhaar-lock value="VIKASH SINGH" placeholder="Enter name of POA" readonly />
        </div>
      </div>
      <div class="field">
        <div class="field-head">
          <label class="f-label" for="poaMobile">Mobile No</label>        </div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-phone"/></svg></span>
          <span class="ig-prefix">+91</span>
          <input class="input-plain is-locked" type="text" id="poaMobile" data-auto="mobile" data-aadhaar-lock value="9812233445" placeholder="Enter mobile no" inputmode="numeric" maxlength="10" data-vtype="mobile" readonly />
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="poaFather">Father Name / Husband Name</label></div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-user"/></svg></span>
          <input class="input-plain" type="text" id="poaFather" data-auto="father" value="SURESH SINGH" placeholder="Enter father name / husband name" />
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="relPoa">Relation</label></div>
        <select class="ss-native" id="relPoa" data-placeholder="Select relation" data-auto="relation" hidden>
          <option value="Father" selected>Father</option>
          <option value="Husband">Husband</option>
          <option value="Mother">Mother</option>
          <option value="Guardian">Guardian</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field span-2">
        <div class="field-head">
          <label class="f-label" for="poaAddress">Address</label>        </div>
        <div class="ta-wrap has-icon">
          <span class="ta-icon"><svg class="ic"><use href="#i-pin"/></svg></span>
          <textarea class="textarea is-locked" id="poaAddress" data-count data-auto="address" data-aadhaar-lock placeholder="Enter address" maxlength="500" readonly>45-B, Malviya Nagar, Jaipur, Rajasthan 302017</textarea>
          <span class="char-count">0/500</span>
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="poaEmail">Email Id</label></div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-mail"/></svg></span>
          <input class="input-plain" type="text" id="poaEmail" data-auto="email" value="vikash.singh@example.com" placeholder="Enter email address" data-vtype="email" />
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="poaWhatsapp">WhatsApp No</label></div>
        <div class="input-group">
          <span class="ig-icon wa-ic"><svg class="ic"><use href="#i-wa"/></svg></span>
          <span class="ig-prefix">+91</span>
          <input class="input-plain" type="text" id="poaWhatsapp" data-auto="whatsapp" value="9812233445" placeholder="Enter WhatsApp number" inputmode="numeric" maxlength="10" data-vtype="mobile" />
        </div>
      </div>
    </div>
  </div>
</section>
