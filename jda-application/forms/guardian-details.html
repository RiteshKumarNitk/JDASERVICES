<!-- Guardian Details — reusable form fragment (follows Minor Details)
     Fields are pre-filled with sample data for demonstration. -->
<section class="form-card section">
  <div class="block-bar" style="cursor:default">
    <span class="block-title">Guardian Details</span>
  </div>

  <div class="card-body">
    <p class="sec-sub">Fill in the details of the guardian acting for the minor applicant.</p>
    <div class="seg-tabs">
      <label class="seg-tab">
        <input type="radio" name="aadhaar-guardian" value="with" checked />
        <span>With Aadhaar</span>
      </label>
      <label class="seg-tab">
        <input type="radio" name="aadhaar-guardian" value="without" />
        <span>Without Aadhaar</span>
      </label>
    </div>

    <div class="fetch-block" data-block="guardian">
      <div class="field">
        <div class="field-head"><label class="f-label" for="guardianAadhaar">Guardian Aadhaar Number <i>*</i></label></div>
        <div class="fetch-row">
          <input class="input" type="text" id="guardianAadhaar" data-aadhaar value="4567 8901 2345" placeholder="Enter 12 digit Aadhaar number" inputmode="numeric" maxlength="14" autocomplete="off" required data-vtype="aadhaar" />
          <button class="btn btn-primary fetch-btn" type="button" data-fetch>
            <svg class="ic"><use href="#i-search"/></svg> Fetch Detail
          </button>
        </div>
      </div>
    </div>

    <div class="form-grid">
      <div class="field">
        <div class="field-head"><label class="f-label" for="guardianName">Name of Guardian <i>*</i></label></div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-user"/></svg></span>
          <input class="input-plain is-locked" type="text" id="guardianName" data-auto="name" data-aadhaar-lock value="ARUN KUMAR SHARMA" placeholder="Enter name of guardian" required readonly />
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="guardianFather">Father / Husband Name</label></div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-user"/></svg></span>
          <input class="input-plain" type="text" id="guardianFather" data-auto="father" value="RAKESH KUMAR SHARMA" placeholder="Enter father / husband name" />
        </div>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="relGuardian">Relation to Minor <i>*</i></label></div>
        <select class="ss-native" id="relGuardian" data-placeholder="Select relation" data-auto="relation" hidden required>
          <option value="Father" selected>Father</option>
          <option value="Mother">Mother</option>
          <option value="Grandfather">Grandfather</option>
          <option value="Grandmother">Grandmother</option>
          <option value="Legal Guardian">Legal Guardian</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field">
        <div class="field-head"><label class="f-label" for="guardianMobile">Mobile Number <i>*</i></label></div>
        <div class="input-group">
          <span class="ig-icon"><svg class="ic"><use href="#i-phone"/></svg></span>
          <span class="ig-prefix">+91</span>
          <input class="input-plain is-locked" type="text" id="guardianMobile" data-auto="mobile" data-aadhaar-lock value="9829012345" placeholder="Enter mobile number" inputmode="numeric" maxlength="10" required data-vtype="mobile" readonly />
        </div>
      </div>
      <div class="field span-2">
        <div class="field-head"><label class="f-label" for="guardianAddress">Address <i>*</i></label></div>
        <div class="ta-wrap has-icon">
          <span class="ta-icon"><svg class="ic"><use href="#i-pin"/></svg></span>
          <textarea class="textarea" id="guardianAddress" data-count data-auto="address" placeholder="Enter address" maxlength="500" required>12, Vidhyadhar Nagar, Sector 4, Jaipur, Rajasthan 302039</textarea>
          <span class="char-count">0/500</span>
        </div>
      </div>
    </div>
  </div>
</section>
